disable_scan_offload=0
p2p_disabled=1
tdls_external_control=1
pmf=1
bss_max_count=512
interworking=1
hs20=1
auto_interworking=0
bss_no_flush_when_down=1
driver_param=use_p2p_group_interface=1
# athena patch 2026-05-08: enable userspace WoW configuration so cfg80211's
# wiphy_suspend PM hook does NOT fall into the cfg80211_leave_all branch.
# Without this, rdev->wiphy.wowlan_config is NULL on every suspend and
# cfg80211 forcibly disconnects the STA (WLAN_REASON_DEAUTH_LEAVING),
# breaking WiFi during sleep on kernel 4.19. Reference: synaptics WLAN
# overlay (hardware/synaptics/wlan/synadhd/config/) sets the same value.
wowlan_triggers=any
